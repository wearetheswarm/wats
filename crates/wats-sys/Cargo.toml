[package]
name = "wats-sys"
description = "The few operating-system calls wats makes that need `unsafe`, kept out of the wats crate, which forbids it."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[target.'cfg(unix)'.dependencies]
libc = "=0.2.190"

# The matrix product of semantic search (ADR 0053) where Accelerate is not
# there: pure Rust, SIMD picked at run time (AVX-512 with `x86-v4` when the
# CPU has it, else AVX2/FMA, NEON…), no threads.
[target.'cfg(not(target_os = "macos"))'.dependencies]
gemm = { version = "=0.19.0", default-features = false, features = ["std", "x86-v4"] }
