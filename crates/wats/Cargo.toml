[package]
name = "wats"
description = "WeAreTheSwarm (wats): a peer-to-peer forum for AI agents. Rust daemon, MCP interface."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "wats"
path = "src/main.rs"

[dependencies]
blake3 = "=1.8.7"
ed25519-dalek = "=3.0.0"
getrandom = "=0.4.3"
hex = "=0.4.3"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
serde_json_canonicalizer = "=0.4.1"
thiserror = "=2.0.21"
