[package]
name = "wats"
description = "A distributed, secure collective of AI agents that share memory, help each other and work together, with humans in the loop through MCP."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "wats"
path = "src/main.rs"

[dependencies]
anyhow = "=1.0.104"
blake3 = "=1.8.7"
bytes = "=1.12.1"
clap = { version = "=4.6.7", features = ["derive", "env"] }
curve25519-dalek = "=5.0.0"
ed25519-dalek = "=3.0.0"
getrandom = "=0.4.3"
hex = "=0.4.3"
iroh = { version = "=1.3.0", default-features = false, features = ["metrics", "fast-apple-datapath", "tls-ring"] }
iroh-blobs = "=0.103.1"
# The verified chunks of a blob fetched without a store (blob repair,
# src/node.rs): the version iroh-blobs uses.
bao-tree = { version = "=0.16.1", default-features = false }
# The blob store's database, opened once before iroh-blobs does (which
# hangs when it cannot): the version iroh-blobs uses.
redb = "=4.4.0"
iroh-gossip = "=0.101.0"
iroh-relay = { version = "=1.3.0", default-features = false }
iroh-tickets = "=1.0.0"
n0-future = "=0.3.2"
rmcp = { version = "=3.5.1", features = ["server", "macros", "transport-io"] }
rusqlite = { version = "=0.40.2", features = ["bundled"] }
schemars = "=1.2.3"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
serde_json_canonicalizer = "=0.4.1"
thiserror = "=2.0.21"
tokio = { version = "=1.53.3", features = ["full"] }
toml = { version = "=1.1.8", default-features = false, features = ["std", "serde", "parse"] }
toml_edit = { version = "=0.25.17", default-features = false, features = ["parse", "display"] }
tracing = "=0.1.44"
url = "=2.5.8"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter"] }
ed25519-zebra = { version = "=5.0.0", default-features = false, features = ["std"] }
# `wats upgrade` and the update check (src/update.rs). reqwest and rustls
# are already in the tree through iroh, with the same features.
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std"] }
minisign-verify = "=0.3.0"
sha2 = "=0.11.1"
flate2 = { version = "=1.1.10", default-features = false, features = ["rust_backend"] }
tar = { version = "=0.4.46", default-features = false }
# The sealed inbox (src/inbox.rs, ADR 0015 §5): HPKE with X-Wing,
# HKDF-SHA256 and ChaCha20-Poly1305.
hpke = { version = "=0.14.1", default-features = false, features = ["alloc", "getrandom", "x25519", "mlkem", "chacha"] }

# Killing an agent run's process group (src/background.rs, ADR 0031 §3):
# a safe killpg(2), the version already in the tree.
[target.'cfg(unix)'.dependencies]
nix = { version = "=0.31.3", default-features = false, features = ["signal"] }

[dev-dependencies]
# A local relay server for the relay chaos test (tests/reconnect.rs). Never
# a normal dependency: the shipped binary has no relay server.
iroh-relay = { version = "=1.3.0", default-features = false, features = ["server"] }
rmcp = { version = "=3.5.1", features = ["client", "transport-child-process"] }
tempfile = "=3.27.0"

# musl's allocator is slow under concurrency; static Linux builds use
# mimalloc instead (MIT).
[target.'cfg(target_env = "musl")'.dependencies]
mimalloc = "=0.1.52"
