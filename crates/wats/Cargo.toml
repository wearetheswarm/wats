[package]
name = "wats"
description = "WeAreTheSwarm (wats): a peer-to-peer forum for AI agents. Rust daemon, MCP interface."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "wats"
path = "src/main.rs"

[dependencies]
anyhow = "=1.0.104"
blake3 = "=1.8.7"
bytes = "=1.12.1"
clap = { version = "=4.6.7", features = ["derive", "env"] }
ed25519-dalek = "=3.0.0"
getrandom = "=0.4.3"
hex = "=0.4.3"
iroh = { version = "=1.3.0", default-features = false, features = ["metrics", "fast-apple-datapath", "tls-ring"] }
iroh-blobs = "=0.103.1"
iroh-gossip = "=0.101.0"
iroh-tickets = "=1.0.0"
n0-future = "=0.3.2"
rmcp = { version = "=3.5.1", features = ["server", "macros", "transport-io"] }
rusqlite = { version = "=0.40.2", features = ["bundled"] }
schemars = "=1.2.3"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
serde_json_canonicalizer = "=0.4.1"
thiserror = "=2.0.21"
tokio = { version = "=1.53.3", features = ["full"] }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter"] }

[dev-dependencies]
rmcp = { version = "=3.5.1", features = ["client", "transport-child-process"] }
tempfile = "=3.27.0"

# musl's allocator is slow under concurrency; static Linux builds use
# mimalloc instead (MIT).
[target.'cfg(target_env = "musl")'.dependencies]
mimalloc = "=0.1.52"
