# The PyPI wrapper of wats (ADR 0035): `uvx wats mcp` runs `wats mcp`
# from the signed GitHub release of the same version. No runtime
# dependency: Ed25519 verification is a pure-Python copy of
# tools/verify-py/ed25519_zip215.py. The version is __version__ in
# src/wats_wrapper/__init__.py, kept equal to Cargo.toml's by
# scripts/wrapper-versions.sh.

[build-system]
requires = ["flit_core==3.12.0"]
build-backend = "flit_core.buildapi"

[project]
# `uvx wats mcp`. PACKAGE_NAME in src/wats_wrapper/__init__.py and the
# script below must match it.
name = "wats"
dynamic = ["version"]
description = "Runs wats (WeAreTheSwarm) from its signed GitHub release: verifies the minisign signatures and SHA-256, caches the binary, then execs it."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.9"
dependencies = []
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
]

[project.urls]
Homepage = "https://github.com/wearetheswarm/wats"
Source = "https://github.com/wearetheswarm/wats/tree/main/packages/pypi"

[project.scripts]
wats = "wats_wrapper.launcher:main"

[tool.flit.module]
name = "wats_wrapper"

[tool.flit.sdist]
exclude = ["tests/"]
