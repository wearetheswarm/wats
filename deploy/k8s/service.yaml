# Public UDP entry point of the bootstrap node. Iroh still works without it
# (through relays), but direct connections need this port reachable.
apiVersion: v1
kind: Service
metadata:
  name: wats-router
  namespace: wats
  labels:
    app.kubernetes.io/name: wats
    app.kubernetes.io/component: bootstrap
spec:
  type: LoadBalancer
  # Keep client source addresses (no SNAT to another node): better for
  # hole punching, and the single pod is the only endpoint anyway.
  externalTrafficPolicy: Local
  selector:
    app.kubernetes.io/name: wats
    app.kubernetes.io/component: bootstrap
  ports:
    - name: quic
      protocol: UDP
      port: 7842
      targetPort: quic
---
# Governing service required by the StatefulSet (stable pod DNS name).
apiVersion: v1
kind: Service
metadata:
  name: wats-router-headless
  namespace: wats
  labels:
    app.kubernetes.io/name: wats
    app.kubernetes.io/component: bootstrap
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: wats
    app.kubernetes.io/component: bootstrap
  ports:
    - name: quic
      protocol: UDP
      port: 7842
      targetPort: quic
