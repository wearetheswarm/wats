# The public bootstrap node ("router"). One replica, never more: its
# endpoint id is pinned in the wats binary. The id derives from the root
# secret, mounted from the Secret `wats-router-key` (generated and backed
# up on your machine, see docs/deploy-bootstrap.md); the volume holds the
# node's data (events, blobs).
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: wats-router
  namespace: wats
  labels:
    app.kubernetes.io/name: wats
    app.kubernetes.io/component: bootstrap
spec:
  replicas: 1
  serviceName: wats-router-headless
  podManagementPolicy: OrderedReady
  selector:
    matchLabels:
      app.kubernetes.io/name: wats
      app.kubernetes.io/component: bootstrap
  template:
    metadata:
      labels:
        app.kubernetes.io/name: wats
        app.kubernetes.io/component: bootstrap
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      imagePullSecrets:
        - name: ghcr-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: wats
          # Pinned version, set in kustomization.yaml (images: newTag).
          image: ghcr.io/wearetheswarm/wats:0.1.0
          imagePullPolicy: IfNotPresent
          args: ["node", "--quiet"]
          env:
            # A subdirectory the node owns (it sets 0700 on it); the volume
            # root belongs to root with group 65532.
            - name: WATS_DIR
              value: /data/wats
            - name: WATS_SECRET_FILE
              value: /etc/wats/secret.key
            - name: WATS_PORT
              value: "7842"
            - name: RUST_LOG
              value: wats=info,iroh=warn
            # Optional, once the load balancer has a public IP:
            # - name: WATS_EXTERNAL_ADDR
            #   value: "<load-balancer-ip>:7842"
          ports:
            - name: quic
              containerPort: 7842
              protocol: UDP
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
            - name: key
              mountPath: /etc/wats
              readOnly: true
      volumes:
        - name: key
          secret:
            secretName: wats-router-key
            defaultMode: 0440
            items:
              - key: secret.key
                path: secret.key
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/name: wats
          app.kubernetes.io/component: bootstrap
      spec:
        accessModes: ["ReadWriteOnce"]
        # Default storage class of the cluster; set storageClassName here to
        # choose another one.
        resources:
          requests:
            storage: 5Gi
