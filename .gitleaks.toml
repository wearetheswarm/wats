# gitleaks configuration (CI: the "secret scan" step of .github/workflows/ci.yml).
# The default rules, minus known public material that looks like keys.
title = "wats"

[extend]
useDefault = true

[allowlist]
description = "Public keys and signatures, not secrets"
paths = [
  # Event test vectors: public keys, ids and signatures by design.
  '''docs/test-vectors/.*\.json''',
  # Signed fixtures of the upgrade and install tests (a throwaway key).
  '''crates/wats/tests/fixtures/.*''',
]
regexes = [
  # minisign public keys (the release key is pinned in several places).
  '''RW[A-Za-z0-9+/]{54}''',
]
