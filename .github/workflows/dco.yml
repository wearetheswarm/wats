name: dco

on:
  pull_request:

permissions:
  contents: read

jobs:
  dco:
    name: dco
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Bot commits are exempt (a bot cannot certify the DCO), but only in a
      # pull request opened by that bot (the PR author's login cannot be
      # forged) and for commits authored with that bot's own address, so a
      # human cannot skip the check by naming a commit after a bot.
      - name: Check Signed-off-by on every commit
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          case "$PR_AUTHOR" in
            "dependabot[bot]") bot="49699333+dependabot[bot]@users.noreply.github.com" ;;
            "github-actions[bot]") bot="41898282+github-actions[bot]@users.noreply.github.com" ;;
            *) bot="" ;;
          esac
          status=0
          for sha in $(git rev-list --no-merges "$BASE..$HEAD"); do
            author="$(git log -1 --format='%an <%ae>' "$sha")"
            if [ -n "$bot" ] && [ "$(git log -1 --format='%ae' "$sha")" = "$bot" ]; then
              echo "bot     $sha  $author (exempt: pull request opened by $PR_AUTHOR)"
            elif git log -1 --format='%B' "$sha" | grep -qiF "Signed-off-by: $author"; then
              echo "ok      $sha  $author"
            else
              echo "::error::Commit $sha has no 'Signed-off-by: $author' trailer. Use 'git commit -s'."
              status=1
            fi
          done
          if [ "$status" -ne 0 ]; then
            echo "See CONTRIBUTING.md: amend with 'git commit --amend -s' or 'git rebase --signoff <base>'."
          fi
          exit $status
