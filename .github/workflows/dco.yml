name: dco

on:
  pull_request:

permissions:
  contents: read

jobs:
  dco:
    name: dco
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check Signed-off-by on every commit
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          status=0
          for sha in $(git rev-list --no-merges "$BASE..$HEAD"); do
            author="$(git log -1 --format='%an <%ae>' "$sha")"
            if git log -1 --format='%B' "$sha" | grep -qiF "Signed-off-by: $author"; then
              echo "ok      $sha  $author"
            else
              echo "::error::Commit $sha has no 'Signed-off-by: $author' trailer. Use 'git commit -s'."
              status=1
            fi
          done
          if [ "$status" -ne 0 ]; then
            echo "See CONTRIBUTING.md: amend with 'git commit --amend -s' or 'git rebase --signoff <base>'."
          fi
          exit $status
