name: model

# Builds, signs and publishes semantic search's model file (ADR 0053 §4),
# by hand, once per model:
#   - downloads the upstream bge-small-en-v1.5 weights at a pinned revision
#     and checks their SHA-256 (examples/semantic_model.rs checks it too);
#   - converts them reproducibly to bge-small-en-v1.5-f16.safetensors, and
#     fails unless the result is the file the binary pins
#     (semantic::MODEL_SHA256 in crates/wats/src/semantic/mod.rs);
#   - signs the file and its .sha256 with minisign, with the release key
#     (MINISIGN_SECRET_KEY, as release.yml; docs/release-signing.md);
#   - publishes them as release model-bge-small-en-v1.5-f16, which nodes
#     download from (semantic::engine::MODEL_URL).
# The release is created with the workflow's token, so release.yml does
# not run for it (and skips model-* tags anyway).
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: model
  cancel-in-progress: false

jobs:
  model:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TAG: model-bge-small-en-v1.5-f16
      FILE: bge-small-en-v1.5-f16.safetensors
      UPSTREAM_URL: https://huggingface.co/BAAI/bge-small-en-v1.5/resolve/5c38ec7c405ec4b44b94cc5a9bb96e735b38267a/model.safetensors
      UPSTREAM_SHA256: 3c9f31665447c8911517620762200d2245a2518d6e7208acc78cd9db317e21ad
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Signing key
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        run: |
          if [ -z "$MINISIGN_SECRET_KEY" ]; then
            echo "::error::MINISIGN_SECRET_KEY is not set: refusing to publish an unsigned model (see docs/release-signing.md)"
            exit 1
          fi

      - name: Build the model file
        run: |
          curl -fsSL --proto '=https' --tlsv1.2 -o upstream.safetensors "$UPSTREAM_URL"
          echo "$UPSTREAM_SHA256  upstream.safetensors" | sha256sum -c -
          cargo run --release --locked -p wats --example semantic_model -- upstream.safetensors "$FILE"
          pinned="$(grep -m1 'pub const MODEL_SHA256' crates/wats/src/semantic/mod.rs | cut -d'"' -f2)"
          echo "$pinned  $FILE" | sha256sum -c -
          sha256sum "$FILE" > "$FILE.sha256"

      # As in release.yml: a pinned upstream minisign, checked against a
      # hard-coded SHA-256.
      - name: Install minisign
        env:
          MINISIGN_VERSION: "0.12"
          MINISIGN_LINUX_SHA256: 9a599b48ba6eb7b1e80f12f36b94ceca7c00b7a5173c95c3efc88d9822957e73
        run: |
          dir="$RUNNER_TEMP/minisign"
          mkdir -p "$dir/bin"
          asset="minisign-$MINISIGN_VERSION-linux.tar.gz"
          curl -fsSL --proto '=https' --tlsv1.2 -o "$dir/$asset" \
            "https://github.com/jedisct1/minisign/releases/download/$MINISIGN_VERSION/$asset"
          echo "$MINISIGN_LINUX_SHA256  $dir/$asset" | sha256sum -c -
          tar -xzf "$dir/$asset" -C "$dir"
          cp "$dir/minisign-linux/x86_64/minisign" "$dir/bin/minisign"
          chmod +x "$dir/bin/minisign"
          echo "$dir/bin" >> "$GITHUB_PATH"

      - name: Sign
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        run: |
          key="$RUNNER_TEMP/minisign.key"
          pubfile="$RUNNER_TEMP/minisign.pub"
          trap 'rm -f "$key"' EXIT
          (umask 077 && printf '%s\n' "$MINISIGN_SECRET_KEY" > "$key")
          minisign -R -s "$key" -p "$pubfile" < /dev/null
          pub="$(tail -n 1 "$pubfile")"
          grep -qF "$pub" crates/wats/src/update.rs || {
            echo "::error::the signing key is not the release key the binary pins"
            exit 1
          }
          for f in "$FILE" "$FILE.sha256"; do
            minisign -S -s "$key" -m "$f" < /dev/null
            minisign -V -P "$pub" -m "$f"
          done

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files=("$FILE" "$FILE.sha256" "$FILE.minisig" "$FILE.sha256.minisig")
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "${files[@]}" --clobber
          else
            gh release create "$TAG" "${files[@]}" --latest=false \
              --title "Semantic search model: bge-small-en-v1.5 (fp16)" \
              --notes "The model file of semantic search (ADR 0053), built reproducibly from BAAI/bge-small-en-v1.5 (MIT) at revision 5c38ec7 by examples/semantic_model.rs, and signed with the release key. Nodes download it once and check its pinned SHA-256 and signature. Not a wats release."
          fi
