name: ci

# Budget mode while the repo is private (GitHub Free: 2,000 min/month,
# macOS billed 10x): Linux runs on pull requests and pushes to main
# (docs-only pushes skipped); macOS runs only on manual dispatch and on a
# weekly schedule. Restore macOS on pull requests once the repo is public.

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "brand/**"
      - "DCO"
      - "LICENSE"
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly macOS run, Monday 06:00 UTC.
    - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON((github.event_name == 'workflow_dispatch' || github.event_name == 'schedule') && '["ubuntu-latest", "macos-latest"]' || '["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain (from rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
      - name: cargo fmt
        run: cargo fmt --all --check
      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: cargo test
        run: cargo test
      # Second, independent event verifier (Python, standard library only)
      # against the published vectors: a prerequisite of the format freeze
      # (ADR 0010). Linux only, it is platform-independent.
      - name: Python verifier vs test vectors
        if: runner.os == 'Linux'
        run: python3 tools/verify-py/verify.py docs/test-vectors/events.json docs/test-vectors/events-invalid.json
      # Dependency policy (licenses, advisories, sources): Linux only, it is
      # platform-independent.
      - name: Install cargo-deny
        if: runner.os == 'Linux'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - name: cargo deny
        if: runner.os == 'Linux'
        run: cargo deny check
      # install.sh: shellcheck, and its verification against signed fixtures
      # (a tampered archive or a wrong signature must be refused).
      - name: install.sh
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y -qq minisign >/dev/null
          shellcheck install.sh scripts/test-install.sh
          sh scripts/test-install.sh

  # Single aggregate status named "ci", used as the required check on main.
  ci:
    name: ci
    needs: check
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: All checks passed
        if: needs.check.result == 'success'
        run: echo "ok"
      - name: Some checks failed
        if: needs.check.result != 'success'
        run: exit 1
