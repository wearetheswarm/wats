name: ci

# Linux and macOS on pull requests and pushes to main (docs-only pushes
# skipped), plus a weekly run that catches toolchain and dependency drift.

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "brand/**"
      - "DCO"
      - "LICENSE"
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly run, Monday 06:00 UTC.
    - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Install toolchain (from rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
      - name: cargo fmt
        run: cargo fmt --all --check
      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: cargo test
        run: cargo test
      # Second, independent event verifier (Python, standard library only)
      # against the published vectors: a prerequisite of the format freeze
      # (ADR 0010). Linux only, it is platform-independent.
      - name: Python verifier vs test vectors
        if: runner.os == 'Linux'
        run: python3 tools/verify-py/verify.py docs/test-vectors/events.json docs/test-vectors/events-invalid.json
      # Dependency policy (licenses, advisories, sources): Linux only, it is
      # platform-independent.
      - name: Install cargo-deny
        if: runner.os == 'Linux'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - name: cargo deny
        if: runner.os == 'Linux'
        run: cargo deny check
      # Secret scan: gitleaks, pinned by SHA-256, with .gitleaks.toml (the
      # default rules minus public keys and signatures). The checkout is
      # shallow, so this scans the whole tree of the commit under test.
      - name: Secret scan (gitleaks)
        if: runner.os == 'Linux'
        env:
          GITLEAKS_VERSION: "8.21.2"
          GITLEAKS_SHA256: 5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba
        run: |
          dir="$RUNNER_TEMP/gitleaks"
          mkdir -p "$dir"
          asset="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL --proto '=https' --tlsv1.2 -o "$dir/$asset" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$asset"
          echo "$GITLEAKS_SHA256  $dir/$asset" | sha256sum -c -
          tar -xzf "$dir/$asset" -C "$dir" gitleaks
          "$dir/gitleaks" detect --source . --config .gitleaks.toml --redact --no-banner
      # install.sh: shellcheck, and its verification against signed fixtures
      # (a tampered archive or a wrong signature must be refused).
      - name: install.sh
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y -qq minisign >/dev/null
          shellcheck install.sh scripts/test-install.sh
          sh scripts/test-install.sh
      # The Homebrew formula scripts: shellcheck, and refusing tampered or
      # misattributed checksums (scripts/test-homebrew.sh).
      - name: Homebrew formula scripts
        if: runner.os == 'Linux'
        run: |
          shellcheck scripts/homebrew-formula.sh scripts/homebrew-release.sh scripts/test-homebrew.sh
          sh scripts/test-homebrew.sh
      # The security floor of release.yml (ADR 0030): shellcheck, and its
      # results on the CHANGELOG and on made-up ones.
      - name: Security floor script
        if: runner.os == 'Linux'
        run: |
          shellcheck scripts/security-floor.sh scripts/test-security-floor.sh
          sh scripts/test-security-floor.sh
      # The npm and PyPI wrappers (ADR 0035): their versions equal
      # Cargo.toml's, and their verification against signed fixtures (a
      # throwaway key, a local server: never github.com). Node and Python
      # as the runner has them, no install.
      - name: npm and PyPI wrappers
        if: runner.os == 'Linux'
        run: |
          shellcheck scripts/wrapper-versions.sh packages/fixtures/make-fixtures.sh packages/fixtures/fake-wats.sh
          sh scripts/wrapper-versions.sh check
          node --version
          node --test packages/npm/test/*.test.js
          python3 --version
          python3 -m unittest discover -s packages/pypi/tests -v
      # The rendered formula passes Homebrew's own style checks.
      - name: Homebrew formula style
        if: runner.os == 'macOS'
        run: |
          dir="$RUNNER_TEMP/brew"
          mkdir -p "$dir/sums" "$dir/tap/Formula"
          for target in aarch64-apple-darwin x86_64-unknown-linux-musl; do
            printf '%064d  wats-1.2.3-%s.tar.gz\n' 1 "$target" > "$dir/sums/wats-1.2.3-$target.tar.gz.sha256"
          done
          sh scripts/homebrew-formula.sh 1.2.3 "$dir/sums" > "$dir/tap/Formula/wats.rb"
          brew style "$dir/tap/Formula/wats.rb"

  # Single aggregate status named "ci", used as the required check on main.
  ci:
    name: ci
    needs: check
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: All checks passed
        if: needs.check.result == 'success'
        run: echo "ok"
      - name: Some checks failed
        if: needs.check.result != 'success'
        run: exit 1
