name: ci

# Budget mode while the repo is private (GitHub Free: 2,000 min/month,
# macOS billed 10x): pull requests run Linux only; pushes to main and
# manual runs add macOS; docs-only pushes to main are skipped.
# Restore macOS on pull requests once the repo is public.
on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "brand/**"
      - "DCO"
      - "LICENSE"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-latest"]' || '["ubuntu-latest", "macos-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain (from rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - name: cargo fmt
        run: cargo fmt --all --check
      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: cargo test
        run: cargo test

  # Single aggregate status named "ci", used as the required check on main.
  ci:
    name: ci
    needs: check
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: All checks passed
        if: needs.check.result == 'success'
        run: echo "ok"
      - name: Some checks failed
        if: needs.check.result != 'success'
        run: exit 1
