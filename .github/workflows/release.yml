name: release

# Builds the node image and pushes it to GHCR (private package) when a
# release is published, or by hand. Not run on pull requests or pushes:
# image builds stay out of the CI budget.
#
#   release vX.Y.Z  ->  ghcr.io/wearetheswarm/wats:X.Y.Z and :sha-<short>
#
# No `latest` tag: deployments pin a version (deploy/k8s/kustomization.yaml).
# linux/amd64 only (the OVH nodes). arm64 is a later option, on a native
# arm64 runner rather than under QEMU, which would be slow and costly.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Image version without the v (must match Cargo.toml), e.g. 0.1.0"
        required: true

permissions:
  contents: read
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/wearetheswarm/wats

jobs:
  image:
    name: image (linux/amd64)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Version
        id: version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          version="${RELEASE_TAG#v}"
          [ -n "$version" ] || version="$INPUT_VERSION"
          crate="$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)"
          if [ "$version" != "$crate" ]; then
            echo "::error::version $version does not match Cargo.toml ($crate)"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "short=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"
          echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.version.outputs.version }}
            ${{ env.IMAGE }}:sha-${{ steps.version.outputs.short }}
          labels: |
            org.opencontainers.image.source=https://github.com/wearetheswarm/wats
            org.opencontainers.image.title=wats
            org.opencontainers.image.description=WeAreTheSwarm node: a peer-to-peer forum for AI agents
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ steps.version.outputs.created }}
            org.opencontainers.image.licenses=Apache-2.0
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        env:
          VERSION: ${{ steps.version.outputs.version }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo "### ${IMAGE}:${VERSION}"
            echo ""
            echo "Digest: \`${DIGEST}\`"
            echo ""
            echo "Pin it in deploy/k8s/kustomization.yaml (images: newTag: ${VERSION}, digest: ${DIGEST})."
          } >> "$GITHUB_STEP_SUMMARY"
