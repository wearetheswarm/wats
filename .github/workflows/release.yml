name: release

# Builds release binaries and the node image when a release is published,
# or by hand. Not run on pull requests or pushes: release builds stay out of
# the CI budget.
#
# Each target is compiled once:
#   x86_64-unknown-linux-musl  static, any Linux / WSL; the same binary is
#                              packaged into the image (Dockerfile.release,
#                              distroless static) and pushed to GHCR:
#                              ghcr.io/wearetheswarm/wats:X.Y.Z and :sha-<short>
#   aarch64-apple-darwin       Apple silicon (macOS minutes cost ~10x; once
#                              per release)
# Each binary is attached to the release as wats-X.Y.Z-<target>.tar.gz plus
# a .sha256, each signed with minisign (.minisig) with the key held in the
# MINISIGN_SECRET_KEY secret; without it the run fails
# (docs/release-signing.md). Download: gh release download vX.Y.Z -R wearetheswarm/wats
# Windows native and the cargo-dist installers come with the public launch
# (installers need public releases).
#
# No `latest` tag: deployments pin a version (WATS_VERSION in the router .env).
# The image is linux/amd64 only (the OVH VM). arm64 is a later option, built
# on a native arm64 runner rather than under QEMU, which would be slow and
# costly. No cache warming on main: it would spend minutes on every push.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version without the v (must match Cargo.toml), e.g. 0.1.0"
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/wearetheswarm/wats
  IMAGE_TARGET: x86_64-unknown-linux-musl

jobs:
  build:
    name: build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-apple-darwin
            os: macos-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: write   # attach binaries to the release
      packages: write   # push the image (linux leg only)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Version
        id: version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          version="${RELEASE_TAG#v}"
          [ -n "$version" ] || version="$INPUT_VERSION"
          crate="$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)"
          if [ "$version" != "$crate" ]; then
            echo "::error::version $version does not match Cargo.toml ($crate)"
            exit 1
          fi
          {
            echo "version=$version"
            echo "short=$(git rev-parse --short=12 HEAD)"
            echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_OUTPUT"

      - name: Install musl tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update -qq && sudo apt-get install -y -qq musl-tools

      - name: Build
        env:
          TARGET: ${{ matrix.target }}
        run: |
          rustup target add "$TARGET"
          cargo build --release --locked --target "$TARGET" -p wats

      - name: Package
        id: package
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          name="wats-$VERSION-$TARGET"
          mkdir "$name"
          cp "target/$TARGET/release/wats" LICENSE README.md "$name/"
          tar -czf "$name.tar.gz" "$name"
          shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
          cat "$name.tar.gz.sha256"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      # Signing (docs/release-signing.md): the archive and its .sha256 get a
      # minisign .minisig each. The key is a password-less minisign secret
      # key held only in the MINISIGN_SECRET_KEY repo secret. Without it the
      # run fails: no release goes out unsigned.
      - name: Signing key
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        run: |
          if [ -z "$MINISIGN_SECRET_KEY" ]; then
            echo "::error::MINISIGN_SECRET_KEY is not set: refusing to build an unsigned release (see docs/release-signing.md)"
            exit 1
          fi

      # A pinned upstream release, checked against a hard-coded SHA-256. The
      # hashes are those of the 0.12 assets, whose .minisig verify with the
      # upstream key RWQf6LRCGA9i53mlYecO4IzT51TGPpvWucNSCh1CBM0QTaLn73Y7GFO3
      # (https://jedisct1.github.io/minisign/). Recheck both when bumping.
      - name: Install minisign
        env:
          MINISIGN_VERSION: "0.12"
          MINISIGN_LINUX_SHA256: 9a599b48ba6eb7b1e80f12f36b94ceca7c00b7a5173c95c3efc88d9822957e73
          MINISIGN_MACOS_SHA256: 89000b19535765f9cffc65a65d64a820f433ef6db8020667f7570e06bf6aac63
        run: |
          case "$RUNNER_OS-$RUNNER_ARCH" in
            Linux-X64)   asset="minisign-$MINISIGN_VERSION-linux.tar.gz"; sha="$MINISIGN_LINUX_SHA256" ;;
            macOS-ARM64) asset="minisign-$MINISIGN_VERSION-macos.zip";    sha="$MINISIGN_MACOS_SHA256" ;;
            *) echo "::error::no pinned minisign for $RUNNER_OS-$RUNNER_ARCH"; exit 1 ;;
          esac
          dir="$RUNNER_TEMP/minisign"
          mkdir -p "$dir/bin"
          curl -fsSL --proto '=https' --tlsv1.2 -o "$dir/$asset" \
            "https://github.com/jedisct1/minisign/releases/download/$MINISIGN_VERSION/$asset"
          echo "$sha  $dir/$asset" | shasum -a 256 -c -
          case "$asset" in
            *.tar.gz) tar -xzf "$dir/$asset" -C "$dir"
                      cp "$dir/minisign-linux/x86_64/minisign" "$dir/bin/minisign" ;;
            *.zip)    unzip -q "$dir/$asset" minisign -d "$dir/bin" ;;
          esac
          chmod +x "$dir/bin/minisign"
          "$dir/bin/minisign" -v
          echo "$dir/bin" >> "$GITHUB_PATH"

      # Signs, verifies each signature with the public key derived from the
      # secret key, and checks that this public key is the one published in
      # README.md and docs/release-signing.md (an error otherwise). A key with
      # a password fails here: stdin is closed, so minisign cannot prompt.
      - name: Sign
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          NAME: ${{ steps.package.outputs.name }}
        run: |
          key="$RUNNER_TEMP/minisign.key"
          pubfile="$RUNNER_TEMP/minisign.pub"
          trap 'rm -f "$key"' EXIT
          (umask 077 && printf '%s\n' "$MINISIGN_SECRET_KEY" > "$key")
          if ! minisign -R -s "$key" -p "$pubfile" < /dev/null; then
            echo "::error::MINISIGN_SECRET_KEY must be a whole minisign secret key file without password (minisign -G -W)"
            exit 1
          fi
          pub="$(tail -n 1 "$pubfile")"
          for f in "$NAME.tar.gz" "$NAME.tar.gz.sha256"; do
            minisign -S -s "$key" -m "$f" < /dev/null
            minisign -V -P "$pub" -m "$f"
            cat "$f.minisig"
          done
          for doc in README.md docs/release-signing.md; do
            if ! grep -qF "$pub" "$doc"; then
              echo "::error::$doc does not publish the signing public key $pub"
              exit 1
            fi
          done
          {
            echo "### Signed $NAME"
            echo ""
            echo "minisign public key: \`$pub\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Attach to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
          NAME: ${{ steps.package.outputs.name }}
        run: |
          files=("$NAME.tar.gz" "$NAME.tar.gz.sha256")
          for f in "$NAME.tar.gz.minisig" "$NAME.tar.gz.sha256.minisig"; do
            if [ -f "$f" ]; then files+=("$f"); fi
          done
          gh release upload "$TAG" "${files[@]}" --clobber

      - name: Keep as a workflow artifact (manual runs)
        if: github.event_name != 'release'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.package.outputs.name }}
          path: |
            ${{ steps.package.outputs.name }}.tar.gz
            ${{ steps.package.outputs.name }}.tar.gz.sha256
            ${{ steps.package.outputs.name }}.tar.gz*.minisig
          retention-days: 7

      # Image: the static Linux binary built above, on distroless static.
      - name: Image context
        if: matrix.target == env.IMAGE_TARGET
        env:
          TARGET: ${{ matrix.target }}
        run: |
          mkdir -p image-context/data
          cp "target/$TARGET/release/wats" image-context/wats
          file image-context/wats

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: matrix.target == env.IMAGE_TARGET

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: matrix.target == env.IMAGE_TARGET
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the image
        id: image
        if: matrix.target == env.IMAGE_TARGET
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: image-context
          file: Dockerfile.release
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.version.outputs.version }}
            ${{ env.IMAGE }}:sha-${{ steps.version.outputs.short }}
          labels: |
            org.opencontainers.image.source=https://github.com/wearetheswarm/wats
            org.opencontainers.image.title=wats
            org.opencontainers.image.description=WeAreTheSwarm node: a peer-to-peer forum for AI agents
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ steps.version.outputs.created }}
            org.opencontainers.image.licenses=Apache-2.0

      - name: Summary
        if: matrix.target == env.IMAGE_TARGET
        env:
          VERSION: ${{ steps.version.outputs.version }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          {
            echo "### ${IMAGE}:${VERSION}"
            echo ""
            echo "Digest: \`${DIGEST}\`"
            echo ""
            echo "Deploy it by setting WATS_VERSION=${VERSION} in the router .env (docs/deploy-bootstrap.md)."
          } >> "$GITHUB_STEP_SUMMARY"
